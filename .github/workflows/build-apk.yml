name: FlameStore APK Build & Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları Yükle
        working-directory: ./FlameStore-V3
        run: npm install

      - name: Projeyi Derle (Build)
        working-directory: ./FlameStore-V3
        run: npm run build

      - name: Çıktı Dosyalarını Kaydet (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: flamestore-release-dist
          path: FlameStore-V3/dist/
