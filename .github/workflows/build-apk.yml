name: FlameStore Röntgen & Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projeyi Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Ajan Röntgen - Tüm Dosyaları Listele 🔍
        run: |
          echo "--- DEPONUN ANA DİZİN İÇERİĞİ ---"
          ls -la
          echo "--- PACKAGE.JSON NEREDE? ---"
          find . -name "package.json" || echo "HİÇBİR YERDE BULUNAMADI!"
          
      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kurulum ve Derleme
        run: |
          # Bulduğumuz ilk package.json'ın olduğu klasöre gir
          PKG_DIR=$(find . -name "package.json" -exec dirname {} \; | head -n 1)
          if [ -z "$PKG_DIR" ]; then
            echo "KRİTİK HATA: package.json dosyası repoda yok! Lütfen GitHub'a package.json dosyasını yükleyin."
            exit 1
          fi
          
          echo "Dizin bulundu: $PKG_DIR"
          cd "$PKG_DIR"
          
          npm install
          npm run build
