name: FlameStore Real APK Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi Kopyala
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java (JDK 21) Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Bağımlılıkları ve Capacitor Paketlerini Yükle
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build

      - name: Capacitor Android Projesini Hazırla
        run: |
          npx cap init FlameStore com.flamestore.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Kotlin Çakışmasını Düzelt ve APK Derle
        run: |
          cd android
          
          # Hayat kurtaran Kotlin yaması (Çift kütüphane çakışmasını engeller)
          cat <<EOF >> build.gradle
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Gerçek APK Dosyasını Yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FlameStore-v3-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
