name: FlameStore APK Build & Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Akıllı Dizin Bulucu ve Derleme
        run: |
          # package.json dosyasını repo içinde nerede olursa olsun otomatik bul
          PKG_DIR=$(find . -name "package.json" -exec dirname {} \; | head -n 1)
          echo "Bulunan proje dizini: $PKG_DIR"
          cd "$PKG_DIR"
          
          # Eğer kilit dosyası yoksa otomatik oluştur
          if [ ! -f "package-lock.json" ]; then
            echo "{}" > package-lock.json
          fi
          
          echo "Bağımlılıklar yükleniyor..."
          npm install
          
          echo "Proje derleniyor..."
          npm run build

      - name: Çıktı Dosyalarını Kaydet (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: flamestore-release-dist
          path: '**/dist/'
